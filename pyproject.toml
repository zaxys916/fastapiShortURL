[project]
name = "fastapishorturl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zaxys", email = "zaxys@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.52",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
]

[project.scripts]
fastapishorturl = "fastapishorturl:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
